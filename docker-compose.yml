
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: iris-local-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: iris_dev
      POSTGRES_USER: iris_user
      POSTGRES_PASSWORD: iris_password
    ports:
      - "5433:5432"
    volumes:
      - iris_postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iris_user -d iris_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  iris_postgres_data:
